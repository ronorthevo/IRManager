; ============================================================
;  IRManager — platformio.ini
;  Board   : ESP32-S3-DevKitC-1 (WROOM-1, USB-CDC nativo)
;  Target  : v0.1 — Receptor IR funcional, arquitectura base
; ============================================================

[env:esp32-s3-devkitc-1]
platform            = espressif32
board               = esp32-s3-devkitc-1
framework           = arduino

; ---- Serie y upload ----------------------------------------
monitor_speed       = 115200
upload_speed        = 921600

; ---- USB-CDC nativo del S3 (sin CH340 / CP2102) -----------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; ---- Sistema de ficheros -----------------------------------
board_build.filesystem = littlefs

; ---- Resolución de dependencias ----------------------------
lib_ldf_mode = deep+

; ---- Dependencias con versiones fijadas --------------------
lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson        @ ^7.0.0
    mathieucarbou/AsyncTCP               @ ^3.2.0
    mathieucarbou/ESP Async WebServer    @ ^3.0.6
